# =============================================================================
# pyproject.toml — convex_clustering
# PEP 517/518/621 — build backend: hatchling
# =============================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# -----------------------------------------------------------------------------
# [project] — metadata del paquete 
# -----------------------------------------------------------------------------
[project]
name = "Convex_Clustering"
version = "0.1.0"
description = "Convex interpretable methods, ideal for interpretable outputs"
readme = "README.md"
license = "MIT" 
authors =[
    { name = "Juan Nicolas Mendoza Roncancio ", email = "juannicolasmendoza4@gmail.com" }
]
keywords = ["machine learning", "clustering", "convex optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

requires-python = ">=3.10" 
dependencies = [
    "numpy>=2.1.3",
    "scipy>=1.15.3",
    "scikit-learn>=1.6.1",
]


# -----------------------------------------------------------------------------
# [project.optional-dependencies] — grupos opcionales
# -----------------------------------------------------------------------------
[project.optional-dependencies]
 
viz = [
    "matplotlib>=3.10",
    "IPython >= 8.30"
]

tracking = [
    "mlflow>=3.14"
]

cloud = [
    "boto3>=1.34"
]

dev = [
    "convex-clustering[viz,cloud,tracking,api]",  
    "pytest>=7.4",
    "pytest-cov>=4.1",          
    "ruff>=0.4",                
    "mypy>=1.8",                
    "ipykernel>=6.29.5",           
    "ipython>=8.0",
    "pandas>=2.0",
]


api = [
    "fastapi>=0.11.0",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "httpx2>=0.28",   
]

dashboard = [
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
    "networkx>=3.3",
]

docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25"
]

all = [
    "convex-clustering[viz,api,dashboard]",
]

# -----------------------------------------------------------------------------
# [tool.hatch.build] — le dice a hatchling dónde está el código
# -----------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/convex_clustering"]

# -----------------------------------------------------------------------------
# [tool.pytest.ini_options] — configuración de pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# pythonpath = ["."] adds the repo root to sys.path at test-collection time.
# This makes `app/` importable as a package without installing it via pip.
# The alternative (installing app/ as an editable package) would require
# a separate pyproject.toml inside app/ — unnecessary complexity for a
# single-repo project where app/ and tests/ live at the same level.
pythonpath = ["."]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: tests de larga duración (excluir con -m 'not slow')",
]


# -----------------------------------------------------------------------------
# [tool.ruff] — linter y formatter
# -----------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors (PEP 8)
    "W",    # pycodestyle warnings
    "F",    # pyflakes (imports no usados, variables no definidas)
    "I",    # isort (orden de imports)
    "UP",   # pyupgrade (sintaxis moderna: f-strings, typing, etc.)
    "B",    # flake8-bugbear (errores comunes sutiles)
    "N",    # pep8-naming (snake_case, PascalCase)
]

ignore = [
    "E501",   
    "N803",   
    "N806",   
    "W293",
    "E741",
    "W291",
    "I001",
    "W292",
]
 
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "N802"]


# -----------------------------------------------------------------------------
# [tool.mypy] — type checker
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# app/ uses FastAPI's decorator-based router pattern. FastAPI decorators
# (@router.get, @router.post) return the original function unchanged at
# runtime, but mypy strict mode cannot verify the decorator signatures
# without the fastapi-stubs package (which lags behind FastAPI releases).
# disallow_untyped_decorators = false unblocks mypy on app/ without
# weakening type checking on the library itself (src/convex_clustering/).
module = "app.*"
disallow_untyped_decorators = false

# -----------------------------------------------------------------------------
# [tool.coverage] — configuración de cobertura
# -----------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/convex_clustering"]
omit = ["tests/*", "notebooks/*", "app/*"]
 
[tool.coverage.report]
fail_under = 80
show_missing = true